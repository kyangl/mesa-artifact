# Hybrid (Supervisor + Sub-teams) Topology

name: hybrid
description: "Supervisor with two sub-teams, including intra-team communication"
n_agents: 6

agents:
  - id: supervisor
    role: supervisor
    description: "Top-level coordinator that delegates to team leads"
  - id: team1_lead
    role: intake_lead
    description: "Leads the customer intake team"
  - id: team2_lead
    role: resolution_lead
    description: "Leads the resolution execution team"
  - id: specialist_1
    role: customer_facing
    description: "Interprets customer requests and communicates with customer"
  - id: specialist_2
    role: database
    description: "Accesses order history and customer records"
  - id: specialist_3
    role: policy
    description: "Knows return policies and warranty rules"

edges:
  # Vertical edges (cross-level)
  - source: supervisor
    target: team1_lead
    bidirectional: true
    label: "supervisor-intake_lead"
    edge_type: vertical
    exposure: internal          # supervisor → intake_lead: internal orchestration
    exposure_reverse: internal  # intake_lead → supervisor: internal reporting
  - source: supervisor
    target: team2_lead
    bidirectional: true
    label: "supervisor-resolution_lead"
    edge_type: vertical
    exposure: internal          # supervisor → resolution_lead: internal orchestration
    exposure_reverse: internal  # resolution_lead → supervisor: internal reporting
  - source: team1_lead
    target: specialist_1
    bidirectional: true
    label: "intake_lead-customer"
    edge_type: vertical
    exposure: internal          # intake_lead → customer_facing: internal delegation
    exposure_reverse: direct    # customer_facing → intake_lead: user shapes output (DUI)
  - source: team1_lead
    target: specialist_2
    bidirectional: true
    label: "intake_lead-database"
    edge_type: vertical
    exposure: internal          # intake_lead → database: internal delegation
    exposure_reverse: tool_low  # database → intake_lead: reads external customer records (IPI)
  - source: team2_lead
    target: specialist_3
    bidirectional: true
    label: "resolution_lead-policy"
    edge_type: vertical
    exposure: internal          # resolution_lead → policy: internal delegation
    exposure_reverse: tool_high # policy → resolution_lead: reads knowledge base (IPI)
  # Horizontal edges (intra-team)
  - source: specialist_1
    target: specialist_2
    bidirectional: true
    label: "customer-database-lateral"
    edge_type: horizontal
    exposure: direct            # customer_facing → database (lateral): user shapes output (DUI)
    exposure_reverse: tool_low  # database → customer_facing (lateral): reads customer records (IPI)
  # Cross-team edge
  - source: team1_lead
    target: team2_lead
    bidirectional: true
    label: "intake_lead-resolution_lead"
    edge_type: cross_team
    exposure: internal          # intake_lead → resolution_lead: internal cross-team coordination
    exposure_reverse: internal  # resolution_lead → intake_lead: internal cross-team coordination

properties:
  centralization: medium
  edge_equality: medium
  levels: 3
  edge_types: [vertical, horizontal, cross_team]
  note: "Mix of edge types tests whether edge TYPE matters for vulnerability"
