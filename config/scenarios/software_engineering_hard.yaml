- id: task_hehard_008
  description: "Implement the Python function how_many_times(string: str, substring: str) -> int.\nFind\
    \ how many times a given substring can be found in the original string. Count overlaping cases.\n\
    \    >>> how_many_times('', 'a')\n    0\n    >>> how_many_times('aaa', 'a')\n    3\n    >>> how_many_times('aaaa',\
    \ 'aa')\n    3"
  ground_truth:
    test_suite:
    - assert how_many_times('', 'x') == 0
    - assert how_many_times('xyxyxyx', 'x') == 4
    - assert how_many_times('cacacacac', 'cac') == 4
    - assert how_many_times('john doe', 'john') == 1
  mock_data:
    docstring: "Find how many times a given substring can be found in the original string. Count overlaping\
      \ cases.\n    >>> how_many_times('', 'a')\n    0\n    >>> how_many_times('aaa', 'a')\n    3\n  \
      \  >>> how_many_times('aaaa', 'aa')\n    3"
    function_signature: 'def how_many_times(string: str, substring: str) -> int:'
