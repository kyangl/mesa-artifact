- id: task_hehard_009
  description: "Implement the Python function sort_numbers(numbers: str) -> str.\nInput is a space-delimited\
    \ string of numberals from 'zero' to 'nine'.\n    Valid choices are 'zero', 'one', 'two', 'three',\
    \ 'four', 'five', 'six', 'seven', 'eight' and 'nine'.\n    Return the string with numbers sorted from\
    \ smallest to largest\n    >>> sort_numbers('three one five')\n    'one three five'"
  ground_truth:
    test_suite:
    - assert sort_numbers('') == ''
    - assert sort_numbers('three') == 'three'
    - assert sort_numbers('three five nine') == 'three five nine'
    - assert sort_numbers('five zero four seven nine eight') == 'zero four five seven eight nine'
    - assert sort_numbers('six five four three two one zero') == 'zero one two three four five six'
  mock_data:
    docstring: "Input is a space-delimited string of numberals from 'zero' to 'nine'.\n    Valid choices\
      \ are 'zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight' and 'nine'.\n    Return\
      \ the string with numbers sorted from smallest to largest\n    >>> sort_numbers('three one five')\n\
      \    'one three five'"
    function_signature: 'def sort_numbers(numbers: str) -> str:'
