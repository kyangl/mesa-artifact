name: software_engineering_hard
description: 'Python function implementation from HumanEval docstrings via a 5-role dev pipeline  HARD
  calibration set: HumanEval problems with canonical solutions of 5-13 lines, entry points disjoint from
  the frozen 50. Selected by solution length only, before any outcome was observed.'
roles:
  architect:
    capabilities:
    - design_algorithm
    - specify_approach
    system_prompt: 'You are a software architect. Given a requirements document, your job is to:

      1. Propose a high-level implementation approach (algorithm choice, data structures)

      2. Describe the logic step by step in pseudocode or plain English

      3. Note any tricky edge cases the coder must handle

      4. Pass a clear design specification to the coder

      Do not write complete Python code. Describe the design only.

      '
  coder:
    capabilities:
    - implement_function
    - write_python
    system_prompt: 'You are a Python developer. Given a design specification and the original function

      signature, your job is to write the complete Python implementation.

      Rules:

      1. Write ONLY the function body — do not include import statements unless necessary

      2. The function signature is provided — do not change it

      3. Handle all edge cases mentioned in the specification

      4. Write clean, correct Python 3 code

      5. Output ONLY the Python code, nothing else

      '
  requirements_analyst:
    capabilities:
    - analyze_requirements
    - identify_edge_cases
    system_prompt: 'You are a requirements analyst. Given a Python function specification (docstring),

      your job is to:

      1. Clearly restate what the function must do in plain English

      2. List all input types, output types, and edge cases from the docstring

      3. Identify any implicit requirements (e.g., handling empty inputs)

      4. Pass a structured requirements document to the architect

      Be precise. Do not write any code. Only analyze and document requirements.

      '
  reviewer:
    capabilities:
    - review_code
    - identify_bugs
    system_prompt: 'You are a code reviewer. Given a Python implementation and the original specification,

      your job is to:

      1. Check for logical errors, off-by-one errors, type errors

      2. Verify all edge cases are handled

      3. If you find bugs, describe them precisely and suggest fixes

      4. If the code looks correct, say so explicitly

      5. Do NOT rewrite the code — only review and provide feedback

      '
  tester:
    capabilities:
    - finalize_code
    - apply_fixes
    system_prompt: 'You are a QA engineer. Given code, review feedback, and the original specification,

      your job is to produce the FINAL version of the code.

      Rules:

      1. If the reviewer found bugs, apply the fixes

      2. If the code was approved, output it as-is

      3. Output ONLY the final Python function, nothing else — no explanations

      4. The output must be a complete, runnable Python function

      '
role_mapping:
  customer_facing: requirements_analyst
  database: architect
  intake_lead: architect
  intake_manager: architect
  policy: coder
  resolution_lead: coder
  resolution_manager: coder
  supervisor: tester
  transaction: reviewer
tasks:
- id: task_hehard_001
  description: "Implement the Python function intersperse(numbers: List[int], delimeter: int) -> List[int].\n\
    Insert a number 'delimeter' between every two consecutive elements of input list `numbers'\n    >>>\
    \ intersperse([], 4)\n    []\n    >>> intersperse([1, 2, 3], 4)\n    [1, 4, 2, 4, 3]"
  ground_truth:
    test_suite:
    - assert intersperse([], 7) == []
    - assert intersperse([5, 6, 3, 2], 8) == [5, 8, 6, 8, 3, 8, 2]
    - assert intersperse([2, 2, 2], 2) == [2, 2, 2, 2, 2]
  mock_data:
    docstring: "Insert a number 'delimeter' between every two consecutive elements of input list `numbers'\n\
      \    >>> intersperse([], 4)\n    []\n    >>> intersperse([1, 2, 3], 4)\n    [1, 4, 2, 4, 3]"
    function_signature: 'def intersperse(numbers: List[int], delimeter: int) -> List[int]:'
    imports: from typing import List
    edge_cases:
    - Empty list input
    - Boundary value inputs
    - Typical case with standard values
    humaneval_task_id: HumanEval/5
    canonical_solution_lines: 8
- id: task_hehard_002
  description: "Implement the Python function parse_nested_parens(paren_string: str) -> List[int].\nInput\
    \ to this function is a string represented multiple groups for nested parentheses separated by spaces.\n\
    \    For each of the group, output the deepest level of nesting of parentheses.\n    E.g. (()()) has\
    \ maximum two levels of nesting while ((())) has three.\n\n    >>> parse_nested_parens('(()()) ((()))\
    \ () ((())()())')\n    [2, 3, 1, 3]"
  ground_truth:
    test_suite:
    - assert parse_nested_parens('(()()) ((())) () ((())()())') == [2, 3, 1, 3]
    - assert parse_nested_parens('() (()) ((())) (((())))') == [1, 2, 3, 4]
    - assert parse_nested_parens('(()(())((())))') == [4]
  mock_data:
    docstring: "Input to this function is a string represented multiple groups for nested parentheses\
      \ separated by spaces.\n    For each of the group, output the deepest level of nesting of parentheses.\n\
      \    E.g. (()()) has maximum two levels of nesting while ((())) has three.\n\n    >>> parse_nested_parens('(()())\
      \ ((())) () ((())()())')\n    [2, 3, 1, 3]"
    function_signature: 'def parse_nested_parens(paren_string: str) -> List[int]:'
    imports: from typing import List
    edge_cases:
    - Single element input
    - Boundary value inputs
    - Typical case with standard values
    humaneval_task_id: HumanEval/6
    canonical_solution_lines: 11
- id: task_hehard_003
  description: "Implement the Python function sum_product(numbers: List[int]) -> Tuple[int, int].\nFor\
    \ a given list of integers, return a tuple consisting of a sum and a product of all the integers in\
    \ a list.\n    Empty sum should be equal to 0 and empty product should be equal to 1.\n    >>> sum_product([])\n\
    \    (0, 1)\n    >>> sum_product([1, 2, 3, 4])\n    (10, 24)"
  ground_truth:
    test_suite:
    - assert sum_product([]) == (0, 1)
    - assert sum_product([1, 1, 1]) == (3, 1)
    - assert sum_product([100, 0]) == (100, 0)
    - assert sum_product([3, 5, 7]) == (3 + 5 + 7, 3 * 5 * 7)
    - assert sum_product([10]) == (10, 10)
  mock_data:
    docstring: "For a given list of integers, return a tuple consisting of a sum and a product of all\
      \ the integers in a list.\n    Empty sum should be equal to 0 and empty product should be equal\
      \ to 1.\n    >>> sum_product([])\n    (0, 1)\n    >>> sum_product([1, 2, 3, 4])\n    (10, 24)"
    function_signature: 'def sum_product(numbers: List[int]) -> Tuple[int, int]:'
    imports: from typing import List, Tuple
    edge_cases:
    - Empty list input
    - Zero value input
    - Boundary value inputs
    humaneval_task_id: HumanEval/8
    canonical_solution_lines: 6
- id: task_hehard_004
  description: "Implement the Python function rolling_max(numbers: List[int]) -> List[int].\nFrom a given\
    \ list of integers, generate a list of rolling maximum element found until given moment\n    in the\
    \ sequence.\n    >>> rolling_max([1, 2, 3, 2, 3, 4, 2])\n    [1, 2, 3, 3, 3, 4, 4]"
  ground_truth:
    test_suite:
    - assert rolling_max([]) == []
    - assert rolling_max([1, 2, 3, 4]) == [1, 2, 3, 4]
    - assert rolling_max([4, 3, 2, 1]) == [4, 4, 4, 4]
    - assert rolling_max([3, 2, 3, 100, 3]) == [3, 3, 3, 100, 100]
  mock_data:
    docstring: "From a given list of integers, generate a list of rolling maximum element found until\
      \ given moment\n    in the sequence.\n    >>> rolling_max([1, 2, 3, 2, 3, 4, 2])\n    [1, 2, 3,\
      \ 3, 3, 4, 4]"
    function_signature: 'def rolling_max(numbers: List[int]) -> List[int]:'
    imports: from typing import List, Tuple
    edge_cases:
    - Empty list input
    - Boundary value inputs
    - Typical case with standard values
    humaneval_task_id: HumanEval/9
    canonical_solution_lines: 9
