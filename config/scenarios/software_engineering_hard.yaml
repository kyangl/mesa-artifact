- id: task_hehard_010
  description: "Implement the Python function factorize(n: int) -> List[int].\nReturn list of prime factors\
    \ of given integer in the order from smallest to largest.\n    Each of the factors should be listed\
    \ number of times corresponding to how many times it appeares in factorization.\n    Input number\
    \ should be equal to the product of all factors\n    >>> factorize(8)\n    [2, 2, 2]\n    >>> factorize(25)\n\
    \    [5, 5]\n    >>> factorize(70)\n    [2, 5, 7]"
  ground_truth:
    test_suite:
    - assert factorize(2) == [2]
    - assert factorize(4) == [2, 2]
    - assert factorize(8) == [2, 2, 2]
    - assert factorize(3 * 19) == [3, 19]
    - assert factorize(3 * 19 * 3 * 19) == [3, 3, 19, 19]
    - assert factorize(3 * 19 * 3 * 19 * 3 * 19) == [3, 3, 3, 19, 19, 19]
    - assert factorize(3 * 19 * 19 * 19) == [3, 19, 19, 19]
    - assert factorize(3 * 2 * 3) == [2, 3, 3]
  mock_data:
    docstring: "Return list of prime factors of given integer in the order from smallest to largest.\n\
      \    Each of the factors should be listed number of times corresponding to how many times it appeares\
      \ in factorization.\n    Input number should be equal to the product of all factors\n    >>> factorize(8)\n\
      \    [2, 2, 2]\n    >>> factorize(25)\n    [5, 5]\n    >>> factorize(70)\n    [2, 5, 7]"
    function_signature: 'def factorize(n: int) -> List[int]:'
