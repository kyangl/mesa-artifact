    - Boundary value inputs
    - Typical case with standard values
    humaneval_task_id: HumanEval/11
    canonical_solution_lines: 6
- id: task_hehard_007
  description: "Implement the Python function longest(strings: List[str]) -> Optional[str].\nOut of list\
    \ of strings, return the longest one. Return the first one in case of multiple\n    strings of the\
    \ same length. Return None in case the input list is empty.\n    >>> longest([])\n\n    >>> longest(['a',\
    \ 'b', 'c'])\n    'a'\n    >>> longest(['a', 'bb', 'ccc'])\n    'ccc'"
  ground_truth:
    test_suite:
    - assert longest([]) == None
    - assert longest(['x', 'y', 'z']) == 'x'
    - assert longest(['x', 'yyy', 'zzzz', 'www', 'kkkk', 'abc']) == 'zzzz'
  mock_data:
    docstring: "Out of list of strings, return the longest one. Return the first one in case of multiple\n\
