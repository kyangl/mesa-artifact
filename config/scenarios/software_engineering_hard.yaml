    canonical_solution_lines: 6
- id: task_hehard_006
  description: "Implement the Python function string_xor(a: str, b: str) -> str.\nInput are two strings\
    \ a and b consisting only of 1s and 0s.\n    Perform binary XOR on these inputs and return result\
    \ also as a string.\n    >>> string_xor('010', '110')\n    '100'"
  ground_truth:
    test_suite:
    - assert string_xor('111000', '101010') == '010010'
    - assert string_xor('1', '1') == '0'
    - assert string_xor('0101', '0000') == '0101'
  mock_data:
    docstring: "Input are two strings a and b consisting only of 1s and 0s.\n    Perform binary XOR on\
      \ these inputs and return result also as a string.\n    >>> string_xor('010', '110')\n    '100'"
    function_signature: 'def string_xor(a: str, b: str) -> str:'
